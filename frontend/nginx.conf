server {
    listen 80;
    root /usr/share/nginx/html;

    # Docker's DNS. Looking `app` up per request (through a variable) means
    # nginx keeps working when the backend container restarts with a new IP.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /api/ {
        set $backend http://app:8000;
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;  # sending reports to many recipients can take a while
    }

    location /assets/ {  # file names contain a content hash
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {  # single-page app: unknown paths get index.html
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
