# Start order: backend (app) first, frontend (web) once the backend is healthy.
#   make run                          backend, wait for health, then build and start the frontend (and the bot if a token is set)
#   docker compose up -d --build      same order, enforced by depends_on (both images are built first)
#   ./setup.sh                        fills .env, then does what `make run` does

services:
  app:  # backend: FastAPI + SQLite
    build:
      context: .
      target: runtime
    env_file:  # the app sends reports with TELEGRAM_BOT_TOKEN
      - path: .env
        required: false
    environment:
      TZ: ${TZ:-Asia/Jakarta}
    volumes:
      - sales-db:/app/var  # SQLite: survives restarts and `down`; removed only by `down -v` (./setup.sh reset)
      - ./config:/app/config:ro  # recipients.csv is read at startup
      - ./data:/app/data:ro  # seed source; read on first setup and by ./setup.sh reseed
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  web:  # frontend: built React app on nginx; forwards /api to app
    build: ./frontend
    ports:
      - "${APP_PORT:-8000}:80"
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/api/health"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  bot:
    build: ./bot
    profiles: ["bot"]
    env_file:
      - path: .env
        required: false
    environment:
      API_URL: http://app:8000
      TZ: ${TZ:-Asia/Jakarta}
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped

  test:  # backend unit tests: make test
    build:
      context: .
      target: test
    profiles: ["test"]

volumes:
  sales-db:
